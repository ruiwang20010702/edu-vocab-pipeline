# Gaea 单容器 Nginx 配置
# 注意：proxy_pass 指向容器内 gunicorn（127.0.0.1:8000），非外部服务
# TLS 终止由 Gaea 平台负责，此处仅监听 HTTP 80
# 访问日志由 Python AccessLogMiddleware 统一记录，nginx 层关闭避免重复

server {
    listen 80;
    server_name _;

    access_log off;
    error_log /dev/stderr warn;

    # 安全响应头
    add_header X-Content-Type-Options  "nosniff"                       always;
    add_header X-Frame-Options         "DENY"                          always;
    add_header X-XSS-Protection        "1; mode=block"                 always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到本地 gunicorn
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        client_max_body_size  10M;
    }

    # AI 生成类接口需要更长超时（AI生成 + L2质检可达数分钟）
    location ~ ^/api/reviews/\d+/regenerate$ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout    660s;
        client_max_body_size  10M;
    }

    # 生产批次接口同样需要长超时
    location ~ ^/api/batches/\d+/produce$ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
        client_max_body_size  10M;
    }

    # 健康检查直接代理到后端
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Request-ID $request_id;
    }
}
